instructions: |
  **多因子 Alpha 策略 v2.0（Multi-Factor Alpha Strategy）**

  适用场景：
  - 需要综合多维度判断个股投资价值时。
  - 单因子信号矛盾、需要正交化加权降低噪声时。
  - 对持仓进行因子暴露诊断或因子轮动分析时。

  核心思想：
  单一因子存在周期性失效风险。本策略将 Alpha 来源分解为四个低相关维度（相关系数 < 0.3），
  通过动态加权综合评分，捕捉不同市场风格下的超额收益。

  ---

  ## 四因子定义与评分

  ### 因子 1：趋势因子（权重基准 30%）
  - 使用 `analyze_trend` 判断 MA5/MA10/MA20/MA60 排列。
  - 评估 MACD 金叉/死叉 + 柱状体斜率。
  - 20 日线性回归斜率（标准化）。
  - ADX > 25 趋势确立，> 40 强趋势。
  - 个股 vs 沪深300 的 20 日超额收益。
  - 评分：完美多头+ADX>40+MACD红柱放大 → 85-100；多头+ADX 25-40 → 70-84；均线粘合 → 40-55；空头排列 → 0-30。

  ### 因子 2：量价因子（权重基准 25%）
  - 使用 `get_daily_history` 计算量比（当日/5日均量）。
  - OBV 能量潮 10 日斜率方向。
  - 换手率在近 60 日的百分位。
  - 大单净流入占比（如有数据）。
  - 筹码集中度（90% 筹码价差比）。
  - 评分：温和放量+OBV上行+大单流入 → 80-100；缩量回调+筹码集中 → 65-79；放量滞涨 → 30-45；放量下跌+大单出逃 → 0-25。

  ### 因子 3：基本面因子（权重基准 25%）
  - 使用 `get_stock_info` 获取 ROE、营收/净利增速、PE、PEG、现金流。
  - ROE > 15% 优秀，观察趋势方向。
  - PE 在近 3 年的百分位（< 30% 低估）。
  - PEG < 1 合理偏低。
  - 经营现金流/净利润 > 0.8 健康。
  - 评分：ROE>20%+增速>30%+PE分位<30%+PEG<0.8 → 85-100；ROE 15-20%+正增长 → 65-84；增速放缓 → 40-60；亏损/现金流恶化 → 0-35。

  ### 因子 4：情绪因子（权重基准 20%）
  - 使用 `search_stock_news` 获取近 3 日舆情正负比。
  - 机构研报数量变化、评级调整方向。
  - RSI(14) > 75 超买 / < 25 超卖。
  - 乖离率：偏离 MA20 > 12% 为极端。
  - 事件催化剂时间距离。
  - 评分：正面催化+机构上调+RSI 50-70 → 80-100；中性 → 50-65；过热(RSI>75+乖离>12%) → 20-40；恐慌 → 0-20（或逆向标记）。

  ---

  ## 动态权重（市场风格适配）

  根据当前市场状态调整四因子权重：
  - 趋势市（ADX>25 占比>60%）→ 趋势 35%，量价 25%，基本面 20%，情绪 15%（加趋势减情绪）
  - 震荡市（ADX<20）→ 趋势 20%，量价 30%，基本面 30%，情绪 20%
  - 主题市（板块轮动加速）→ 趋势 20%，量价 25%，基本面 20%，情绪 30%（加情绪）
  - 熊市/防御（指数破位）→ 趋势 15%，量价 20%，基本面 35%，情绪 10%

  ---

  ## 判断点（Decision Matrix）

  综合 Alpha 分 = 趋势分×W1 + 量价分×W2 + 基本面分×W3 + 情绪分×W4

  | 综合分 | 信号 | 操作 |
  | ≥ 80 | 强买入 | 建仓/加仓 |
  | 65-79 | 弱买入 | 试探建仓 |
  | 50-64 | 持有观察 | 跟踪因子变化 |
  | 35-49 | 减仓警示 | 降至半仓以下 |
  | < 35 | 回避/清仓 | 不参与或退出 |

  因子共振：
  - 四因子全部 ≥ 70 → 最高置信度，最大仓位
  - 三因子 ≥ 65 → 高置信度，标准仓位
  - 双因子背离（2高2低）→ 信号矛盾，观望
  - 单因子极端（仅1个>85）→ 警惕假信号

  因子拐点（优先级高于静态评分）：
  - 趋势拐点：MA5上穿MA20 + MACD零轴上金叉 → 趋势因子 +15
  - 量价拐点：极致缩量后首次温和放量阳线 → 量价因子 +15
  - 基本面拐点：季报超预期 + 机构集中上调 → 基本面 +10
  - 情绪冰点反转：RSI<20 + 负面舆情见顶 → 标记逆向 +10
  - 趋势破位：MA20下穿MA60 + ADX>30下行 → 趋势因子归零

  ---

  ## 安全过滤（硬性否决）

  以下任一触发，无论评分多高，一律降级：
  - 科创板（688xxx）和创业板（300xxx）标的 → 直接排除，不纳入分析（用户无交易权限）
  - 日均成交额 < 5000 万 / 连续3日换手 < 0.3% / 停牌复牌首日
  - 近30日有立案调查/问询函 / 近60日财务造假 / 大股东质押>80% / 近期大额解禁
  - 股价处于历史95%分位以上 / 连续3涨停后 / 周线MACD顶背离未修复
  - 大盘系统性风险（沪深300破年线+量缩50%）/ 板块连续3日净流出>10亿

  降级规则：触发1条降一级；触发2条及以上强制观望；触发风险事件类直接清仓。

  ---

  ## 风控纪律

  仓位：强买入(四共振)单票≤25%；弱买入≤15%；减仓信号→0%。
  止损（铁律）：
  - 个股亏损 -7% 无条件止损
  - 收盘跌破 MA20 次日未收回 → 减仓 50%
  - 组合回撤 -10% → 全部降至半仓
  - 10 日未盈利 → 重新评估，无催化退出

  止盈：
  - +20% 上移止损至成本
  - +35% 减仓 1/3，跟踪 MA10
  - +50% 减至 1/4，跟踪 MA20
  - 放量长上影（上影>实体2倍）→ 次日减仓 50%

  禁止：安全过滤触发后买入 / 单票>25% / 追3连板 / 系统性风险开新仓 / 不执行止损

  ---

  ## 输出格式

  分析完成后按以下结构输出：
  ```
  📊 [股票名称(代码)] 多因子 Alpha 评估
  🎯 综合 Alpha 分: XX/100 → [操作信号]
  📈 趋势因子: XX分 | [依据]
  📊 量价因子: XX分 | [依据]
  💰 基本面因子: XX分 | [依据]
  🌡️ 情绪因子: XX分 | [依据]
  ⚡ 因子状态: [共振/背离/中性]
  🚨 安全过滤: [通过/触发X条]
  📋 操作建议: 仓位/入场区间/止损/目标/周期
  ⚠️ 风险提示: [核心风险]
  ```

  评分调整建议：
  - 四因子共振（全部≥70）：`sentiment_score +18`
  - 三因子共振：`sentiment_score +12`
  - 因子拐点触发：对应因子额外 `+10~15`
  - 安全过滤触发降级：`sentiment_score -15`
  - 双因子背离：`sentiment_score -8`，明确标注信号矛盾
  - 趋势破位：`sentiment_score -20`，建议立即退出
